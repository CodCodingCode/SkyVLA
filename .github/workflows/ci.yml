name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Compile every Python file we ship. Isaac Sim / Isaac Lab are not
      # installed on the runner (no GPU, no Omniverse), so we don't import the
      # modules — compileall still catches `SyntaxError` / `IndentationError`
      # across the whole tree without executing any isaaclab imports.
      - name: Compile Python sources
        run: |
          python -m compileall -q skyvla_isaac

  markdown-links:
    name: Markdown link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: yes
          use-verbose-mode: yes
          config-file: .github/markdown-link-check.json
